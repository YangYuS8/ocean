server {
    listen 80;
    server_name localhost;

    # Docker uses 127.0.0.11 for embedded DNS; Podman-compatible
    # environments commonly expose DNS on the container network gateway.
    resolver 127.0.0.11 10.89.1.1 valid=30s ipv6=off;
    set $frontend_upstream frontend:80;

    root /var/www/html/public;
    index index.php index.html;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://$frontend_upstream;
    }

    location = /api {
        return 301 /api/;
    }

    location /api/_nuxt_icon/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://$frontend_upstream;
    }

    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
