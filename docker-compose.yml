name: ocean

services:
  frontend:
    container_name: ocean-frontend
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    volumes:
      - ./frontend:/app:Z
      - frontend-node-modules:/app/node_modules
      - frontend-pnpm-store:/pnpm
    environment:
      NPM_CONFIG_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_API_BASE: http://nginx
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - ocean

  php:
    container_name: ocean-php
    build:
      context: ./backend
      dockerfile: docker/php/Dockerfile
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-mirrors.ustc.edu.cn}
    volumes:
      - ./backend:/var/www/html:Z
    environment:
      PHP_IDE_CONFIG: "serverName=php-dev"
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-test_db}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - ocean

  nginx:
    container_name: ocean-nginx
    image: docker.io/library/nginx:alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html:Z
      - ./nginx:/etc/nginx/conf.d:ro,Z
    depends_on:
      - frontend
      - php
    networks:
      - ocean

  python:
    container_name: ocean-python
    restart: unless-stopped
    build:
      context: ./python
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-mirrors.ustc.edu.cn}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
    working_dir: /workspace
    volumes:
      - ./python:/workspace:Z
      - python-venv:/workspace/.venv
      - ./backend/storage/app/public:/workspace/backend-storage:Z
      - python-uv-cache:/root/.cache/uv
    environment:
      OCEAN_API_BASE: http://nginx
      OCEAN_STORAGE_ROOT: /workspace/backend-storage
      OCEAN_YOLO_MODEL_PATH: /workspace/models/uprc2018/best.pt
      OCEAN_WORKER_POLL_SECONDS: 3
      REDIS_HOST: redis
      REDIS_PORT: 6379
      UV_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
      UV_INSECURE_HOST: ${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
      VIRTUAL_ENV: /workspace/.venv
      PATH: /workspace/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    networks:
      - ocean

  db:
    container_name: ocean-db
    image: docker.io/library/mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-test_db}
    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    networks:
      - ocean

  redis:
    container_name: ocean-redis
    image: docker.io/library/redis:8-alpine
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - ocean

  phpmyadmin:
    container_name: ocean-phpmyadmin
    image: docker.io/library/phpmyadmin
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: ${PMA_HOST:-db}
      PMA_USER: ${PMA_USER:-root}
      PMA_PASSWORD: ${PMA_PASSWORD:-root}
    depends_on:
      - db
    networks:
      - ocean

networks:
  ocean:
    name: ocean-network

volumes:
  frontend-node-modules:
    name: ocean-frontend-node-modules
  frontend-pnpm-store:
    name: ocean-frontend-pnpm-store
  python-uv-cache:
    name: ocean-python-uv-cache
  python-venv:
    name: ocean-python-venv
  mariadb-data:
    name: ocean-mariadb-data
  redis-data:
    name: ocean-redis-data
