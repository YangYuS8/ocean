main:
  push:
    - name: docs-pages
      runner:
        cpus: 2
      docker:
        image: node:24
        volumes:
          - cache:/root/.npm:rw
      imports:
        - https://cnb.cool/Nesoriel/secret-prod/-/blob/main/cloud-providers/tencent-cloud.yml
      lock:
        key: docs-pages
        wait: true
        cancel-in-progress: true
      stages:
        - name: install documentation dependencies
          script: cd website && npm ci

        - name: build documentation site
          script: |
            cd website
            DOCUSAURUS_URL="${DOCUSAURUS_URL:-https://ocean-docs.edgeone.app}" \
              DOCUSAURUS_BASE_URL="${DOCUSAURUS_BASE_URL:-/}" \
              npm run build

        - name: deploy documentation to EdgeOne Pages
          image: tencentcom/deploy-eopages:latest
          if: '[ -n "${EDGEONE_PAGES_API_TOKEN:-}" ]'
          settings:
            project_name: ocean-docs
            api_token: $EDGEONE_PAGES_API_TOKEN
            directory: website/build

  pull_request:
    - name: docs-build-check
      runner:
        cpus: 2
      docker:
        image: node:24
        volumes:
          - cache:/root/.npm:rw
      stages:
        - name: install documentation dependencies
          script: cd website && npm ci

        - name: build documentation site
          script: |
            cd website
            DOCUSAURUS_URL="${DOCUSAURUS_URL:-https://ocean-docs.edgeone.app}" \
              DOCUSAURUS_BASE_URL="${DOCUSAURUS_BASE_URL:-/}" \
              npm run build

$:
  tag_push:
    - name: release
      runner:
        cpus: 2
      docker:
        image: cnbcool/default-build-env:latest
      services:
        - docker
      stages:
        - name: verify release tag
          script: |
            set -euo pipefail
            case "$CNB_BRANCH" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *)
                echo "Skip non-semver tag: $CNB_BRANCH"
                exit 0
                ;;
            esac

            git rev-parse --verify "refs/tags/$CNB_BRANCH"

        - name: build and publish release images
          if: 'case "$CNB_BRANCH" in v[0-9]*.[0-9]*.[0-9]*) exit 0 ;; *) exit 1 ;; esac'
          script: |
            set -euo pipefail

            repo_slug="$(printf '%s' "$CNB_REPO_SLUG" | tr '[:upper:]' '[:lower:]')"
            app_image="$CNB_DOCKER_REGISTRY/$repo_slug/app"
            worker_image="$CNB_DOCKER_REGISTRY/$repo_slug/analysis-worker"

            docker build \
              -f docker/app/Dockerfile \
              -t "$app_image:$CNB_BRANCH" \
              -t "$app_image:latest" \
              .

            docker build \
              -f docker/analysis-worker/Dockerfile \
              -t "$worker_image:$CNB_BRANCH" \
              -t "$worker_image:latest" \
              .

            docker push "$app_image:$CNB_BRANCH"
            docker push "$app_image:latest"
            docker push "$worker_image:$CNB_BRANCH"
            docker push "$worker_image:latest"

        - name: generate release notes
          if: 'case "$CNB_BRANCH" in v[0-9]*.[0-9]*.[0-9]*) exit 0 ;; *) exit 1 ;; esac'
          script: |
            set -euo pipefail

            export TAG_NAME="$CNB_BRANCH"
            previous_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v "^${TAG_NAME}$" | head -n 1 || true)"
            if [ -n "$previous_tag" ]; then
              range="${previous_tag}..${TAG_NAME}"
              export INTRO="Automated release notes generated from commits since \`${previous_tag}\`."
              export COMPARE_URL="https://cnb.cool/${CNB_REPO_SLUG}/-/compare/${previous_tag}...${TAG_NAME}"
            else
              range="${TAG_NAME}"
              export INTRO="Automated release notes generated from commits included in \`${TAG_NAME}\`."
              export COMPARE_URL=""
            fi

            {
              printf '## Ocean %s\n\n' "$TAG_NAME"
              printf '%s\n' "$INTRO"
              printf '\n## Changes\n\n'
              git log "$range" --reverse --pretty=format:'-   %s (`%h`, %an)'
              printf '\n\n## Validation\n\n'
              printf '%s\n' '-   Build and runtime validation should follow the project checks documented in `README.md` and `website/docs/operations/deployment.md`.'
              printf '%s\n' '-   Release images are published to the CNB Docker registry as app and analysis-worker images under this repository slug.'
              if [ -n "$COMPARE_URL" ]; then
                printf '\n**Full Changelog**: %s\n' "$COMPARE_URL"
              fi
            } > release-notes.md

        - name: publish CNB release
          if: 'case "$CNB_BRANCH" in v[0-9]*.[0-9]*.[0-9]*) exit 0 ;; *) exit 1 ;; esac'
          type: git:release
          options:
            tag: $CNB_BRANCH
            descriptionFromFile: release-notes.md
