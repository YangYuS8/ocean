version: 2

updates:
  # 1) Frontend: React / Vite / pnpm
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "frontend"
      - "security"
    assignees:
      - "YangYuS8"
    commit-message:
      prefix: "chore(frontend-deps)"
      include: "scope"
    groups:
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"

  # 2) 后端：Laravel / Composer
  - package-ecosystem: "composer"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "backend"
      - "security"
    assignees:
      - "YangYuS8"
    commit-message:
      prefix: "chore(backend-deps)"
      include: "scope"
    groups:
      backend-security:
        applies-to: security-updates
        patterns:
          - "*"

  # 3) Analysis worker: implemented in Python and managed by uv.
  - package-ecosystem: "pip"
    directory: "/analysis-worker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "analysis-worker"
      - "security"
    assignees:
      - "YangYuS8"
    commit-message:
      prefix: "chore(worker-deps)"
      include: "scope"
    groups:
      analysis-worker-security:
        applies-to: security-updates
        patterns:
          - "*"

  # 4) Docker Compose updates
  - package-ecosystem: "docker-compose"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "infra"

  # 5) GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "ci"
