version: 2

updates:
  # 1) 前端：Nuxt / Vue / pnpm
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "frontend"
      - "security"
    assignees:
      - "YangYuS8"
    commit-message:
      prefix: "chore(frontend-deps)"
      include: "scope"
    groups:
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"

  # 2) 后端：Laravel / Composer
  - package-ecosystem: "composer"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "backend"
      - "security"
    assignees:
      - "YangYuS8"
    commit-message:
      prefix: "chore(backend-deps)"
      include: "scope"
    groups:
      backend-security:
        applies-to: security-updates
        patterns:
          - "*"

  # 3) Python：虽然运行时用 uv，但为了 security updates，建议用 pip 生态解析 pyproject.toml
  - package-ecosystem: "pip"
    directory: "/python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "python"
      - "security"
    assignees:
      - "YangYuS8"
    commit-message:
      prefix: "chore(python-deps)"
      include: "scope"
    groups:
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  # 4) 可选：docker-compose 版本更新
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "infra"

  # 5) 可选：GitHub Actions 版本更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "ci"