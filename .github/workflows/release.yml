name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, for example v1.2.0'
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag exists
        run: git rev-parse --verify "refs/tags/${{ steps.release.outputs.tag }}"

      - name: Resolve image names
        id: images
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "app=${REGISTRY}/${repo}/app" >> "$GITHUB_OUTPUT"
          echo "analysis_worker=${REGISTRY}/${repo}/analysis-worker" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.app }}:${{ steps.release.outputs.tag }}
            ${{ steps.images.outputs.app }}:latest
          labels: |
            org.opencontainers.image.title=Ocean App
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}

      - name: Build and publish analysis worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/analysis-worker/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.analysis_worker }}:${{ steps.release.outputs.tag }}
            ${{ steps.images.outputs.analysis_worker }}:latest
          labels: |
            org.opencontainers.image.title=Ocean Analysis Worker
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}

      - name: Generate release notes
        env:
          TAG_NAME: ${{ steps.release.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          previous_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v "^${TAG_NAME}$" | head -n 1 || true)"
          if [ -n "$previous_tag" ]; then
            range="${previous_tag}..${TAG_NAME}"
            export INTRO="Automated release notes generated from commits since \`${previous_tag}\`."
            export COMPARE_URL="${SERVER_URL}/${REPOSITORY}/compare/${previous_tag}...${TAG_NAME}"
          else
            range="${TAG_NAME}"
            export INTRO="Automated release notes generated from commits included in \`${TAG_NAME}\`."
            export COMPARE_URL=""
          fi

          git log "$range" --reverse --pretty=format:'%H%x1f%h%x1f%an%x1f%s' > commits.tsv

          python3 <<'PY'
          from collections import OrderedDict
          import os

          tag = os.environ["TAG_NAME"]
          intro = os.environ["INTRO"]
          compare_url = os.environ.get("COMPARE_URL", "")

          groups = OrderedDict([
              ("feat", ("Features", [])),
              ("fix", ("Bug Fixes", [])),
              ("docs", ("Documentation", [])),
              ("perf", ("Performance", [])),
              ("refactor", ("Refactoring", [])),
              ("test", ("Tests", [])),
              ("build", ("Build", [])),
              ("ci", ("CI", [])),
              ("chore", ("Maintenance", [])),
              ("deps", ("Dependencies", [])),
              ("other", ("Other Changes", [])),
          ])

          def classify(subject: str) -> str:
              prefix = subject.split(":", 1)[0].lower()
              kind = prefix.split("(", 1)[0]
              if "deps" in kind or subject.startswith("chore(deps") or subject.startswith("chore(frontend-deps"):
                  return "deps"
              return kind if kind in groups else "other"

          for line in open("commits.tsv", encoding="utf-8"):
              line = line.rstrip("\n")
              if not line:
                  continue
              full, short, author, subject = line.split("\x1f", 3)
              key = classify(subject)
              groups[key][1].append(f"-   {subject} (`{short}`, {author})")

          with open("release-notes.md", "w", encoding="utf-8") as out:
              out.write(f"## Ocean {tag}\n\n")
              out.write(f"{intro}\n")
              for _key, (title, entries) in groups.items():
                  if not entries:
                      continue
                  out.write(f"\n## {title}\n\n")
                  out.write("\n".join(entries))
                  out.write("\n")
              out.write("\n## Validation\n\n")
              out.write("-   Build and runtime validation should follow the project checks documented in `README.md` and `website/docs/operations/deployment.md`.\n")
              out.write(f"-   Release images are published to GitHub Container Registry as `ghcr.io/{os.environ['REPOSITORY'].lower()}/app` and `ghcr.io/{os.environ['REPOSITORY'].lower()}/analysis-worker`.\n")
              if compare_url:
                  out.write(f"\n**Full Changelog**: {compare_url}\n")
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$TAG_NAME" --notes-file release-notes.md --latest
          else
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes-file release-notes.md \
              --latest
          fi
