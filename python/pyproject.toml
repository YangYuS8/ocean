[project]
name = "ocean-python"
version = "0.1.0"
description = "Python analysis environment for Ocean"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.3.0",
    "pandas==2.3.0",
    "scipy==1.16.0",
    "scikit-learn==1.7.0",
    "matplotlib==3.10.3",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "ultralytics==8.4.22",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
