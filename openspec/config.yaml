schema: spec-driven

context: |
  项目类型：海洋生态样本与设备巡检管理系统。

  业务目标：
  - 提高样本周转效率。
  - 减少人工误差并规范实验流程。
  - 支持设备巡检、仪器监控、样本图像处理、自动质量评估、统计报表和告警能力。
  - 以最小可行版本优先落地，并在后续逐步扩展高级分析与智能模块。

  当前已确定技术栈：
  - 前端：Vue 3 + Nuxt 4。
  - 前端部署方式：Nuxt 以 Node/Nitro 服务运行，默认通过 3000 端口提供服务，并由 Nginx 反向代理。
  - 后端：PHP，负责统一业务接口、权限控制和运维管理。
  - 数据分析与算法：Python，负责图像处理、质量评估、统计分析和模型推理。
  - 核心数据库：MariaDB。
  - 消息队列：Redis，用于 PHP 与 Python 之间的异步任务分发与解耦。
  - 反向代理与入口：Nginx。
  - 部署方式：Docker Compose，当前基础部署已存在，应优先在现有编排上渐进演进。

  数据与集成约束：
  - MariaDB 管理样本元数据、检测结果和核心业务数据。
  - 样本照片和原始数据文件可使用对象存储归档。
  - PHP 与 Python 优先通过 RESTful API 或 Redis 驱动的异步任务机制协作。
  - 若后续引入时序数据或空间数据专用能力，可再评估 TimescaleDB 或 PostGIS，但当前默认核心库仍为 MariaDB。

  产品与交付约束：
  - 前端界面需适配桌面端、平板和手机，支持现场巡检人员移动操作。
  - 前端设计与交互优先遵循 Nuxt 4 + Vue 3 架构约束，不再按 React/Vite 项目假设。
  - 方案选择优先考虑开源成熟生态、低成本部署、运维可控和长期可扩展性。
  - 在设计新变更时，默认复用现有 Docker、Nginx、MariaDB、Redis 和 Nuxt 基础设施，避免无必要的架构推翻。

rules:
  proposal:
    - 说明该变更解决的业务问题，并明确预期的管理效益、科研效率收益或风险降低价值。
    - 说明该变更是否属于最小可行版本范围，避免范围失控。
    - 若涉及基础设施调整，明确说明对现有 Nuxt、Nginx、Docker Compose、MariaDB 或 Redis 部署的影响。

  design:
    - 明确 Nuxt 前端、PHP 后端、Python 分析模块之间的职责边界。
    - 默认按 Nuxt 4 Node/Nitro 服务部署方式设计，避免将前端误写为纯静态 Vite 应用。
    - 涉及前端部署或网络拓扑时，明确 Nginx 到 Nuxt 3000 端口的反向代理关系。
    - 涉及异步处理时，默认基于 Redis 设计任务分发、后台处理和服务解耦。
    - 涉及数据设计时，默认以 MariaDB 为核心事务库，并说明是否需要额外的专用数据存储。
    - 涉及移动端巡检场景时，说明响应式适配、现场弱网或便携设备使用约束。

  spec:
    - 使用可验证的行为描述需求，避免仅描述技术实现。
    - 明确权限控制、日志审计、异常处理和告警相关要求。
    - 涉及图像处理、统计分析或自动告警时，区分当前能力与后续扩展能力。
    - 涉及跨服务交互时，明确同步接口与异步任务的边界。

  tasks:
    - 优先按可独立交付的模块拆分任务。
    - 标注哪些任务属于 MVP，哪些属于后续增值能力。
    - 涉及跨语言协作时，单独列出接口联调、Redis 队列联调和部署验证任务。
    - 若变更影响容器编排或代理配置，单独列出 Docker Compose、Dockerfile、Nginx 配置和环境变量调整任务。
