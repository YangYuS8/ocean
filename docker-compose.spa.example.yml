services:
  frontend-spa-build:
    build:
      context: ./frontend-spa
      dockerfile: Dockerfile
    image: ocean-frontend-spa:example

  nginx-spa:
    image: docker.io/library/nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./nginx/spa-target.conf.example:/etc/nginx/conf.d/default.conf:ro
      - ./frontend-spa/dist:/usr/share/nginx/html:ro
      - ./backend:/var/www/html:ro
    depends_on:
      - php
    networks:
      - ocean

networks:
  ocean:
    external: true
    name: ocean-network

# Example usage:
# 1. Build the SPA locally: (cd frontend-spa && npm ci && npm run build)
# 2. Start the current stack as usual with docker compose up -d
# 3. Add this example on top when testing the static SPA target:
#    docker compose -f docker-compose.yml -f docker-compose.spa.example.yml up -d nginx-spa
